name: "tauri-build"

on:
  workflow_dispatch:
  push:
  release:
    types: [published]

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get release
        id: get_release
        if: github.event_name == 'release'
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm install

      - name: bump build version for clean Windows upgrades
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag" -and $tagName -match '^v?(\d+\.\d+\.\d+)$') {
            $env:GREMLIN_BUILD_VER = $Matches[1]
          } else {
            $patch = 100 + [int]${{ github.run_number }}
            $env:GREMLIN_BUILD_VER = "0.4.$patch"
          }
          node -e '
            const fs = require("fs");
            const ver = process.env.GREMLIN_BUILD_VER;
            for (const p of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = ver;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n", "utf8");
            }
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version\s*=\s*"[^"]+"/m, `version = "${ver}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo, "utf8");
            console.log("Set build version:", ver);
          '

      - uses: tauri-apps/tauri-action@v0
        name: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.get_release.outputs.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: gremlin-studio-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
